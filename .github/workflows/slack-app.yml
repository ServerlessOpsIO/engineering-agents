name: Slack app

# Keeps the STRIDEr Slack app in step with slack/manifest.yaml.
# Described in docs/handbook/05-ci-cd.md and docs/handbook/08-slack-app.md.
#
# This workflow is separate from Main and Branches on purpose: neither can
# block, slow or cancel the other.

on:
  workflow_dispatch:
    inputs:
      action:
        description: >-
          apply makes the recorded app match the app definition. create makes
          the app; use it for first-time setup or to replace a deleted app.
        type: choice
        options:
          - apply
          - create
        default: apply
  push:
    paths:
      - 'slack/**'
      - 'scripts/slack_app/**'
      - '.github/workflows/slack-app.yml'
  schedule:
    # Once a day. Undoes changes made to the app outside this pipeline.
    - cron: '17 6 * * *'

# Runs queue so that two updates to the app never overlap and the later one
# wins. Nothing is cancelled.
concurrency:
  group: slack-app
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # A secret cannot be tested in a step's `if`, so it is tested here.
      HAS_SERVICE_TOKEN: ${{ secrets.SLACK_SERVICE_TOKEN != '' }}
      SLACK_APP_ID: ${{ vars.SLACK_APP_ID }}
    outputs:
      failure_kind: ${{ steps.result.outputs.failure_kind || steps.offline.outputs.failure_kind }}
      failure_help: ${{ steps.result.outputs.failure_help || steps.offline.outputs.failure_help }}

    steps:
      - name: Setup job workspace
        uses: ServerlessOpsIO/gha-setup-workspace@v2

      - name: Setup Python environment
        uses: ServerlessOpsIO/gha-setup-python@v1
        with:
          python_version: '3.14'

      # Slack's published schema and this project's own rules. Contacts nothing.
      - name: Check the app definition
        id: offline
        run: pipenv run slack-app check --payload "$RUNNER_TEMP/slack-validate.json"

      # Asks Slack whether it accepts the app definition. Changes nothing in
      # Slack. The step passes even when Slack says no; the next step decides.
      - name: Validate with Slack
        id: slack
        if: env.HAS_SERVICE_TOKEN == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: apps.manifest.validate
          token: ${{ secrets.SLACK_SERVICE_TOKEN }}
          payload-file-path: ${{ runner.temp }}/slack-validate.json

      # Only these fields of Slack's answer are passed on, never the whole
      # answer: a step's inputs are shown in its log, and this log is public.
      - name: Read Slack's answer
        id: result
        if: env.HAS_SERVICE_TOKEN == 'true'
        env:
          SLACK_ACTION_OK: ${{ steps.slack.outputs.ok }}
          SLACK_ACTION_ERROR: ${{ fromJSON(steps.slack.outputs.response || '{}').error }}
          SLACK_ACTION_ERRORS: ${{ toJSON(fromJSON(steps.slack.outputs.response || '{}').errors) }}
          SLACK_ACTION_STATUS: ${{ fromJSON(steps.slack.outputs.response || '{}').statusCode }}
          SLACK_ACTION_CODE: ${{ fromJSON(steps.slack.outputs.response || '{}').code }}
          SLACK_ACTION_RETRY_AFTER: ${{ fromJSON(steps.slack.outputs.response || '{}').retryAfter }}
        run: pipenv run slack-app result --method apps.manifest.validate

      - name: Note that Slack validation was skipped
        if: env.HAS_SERVICE_TOKEN != 'true'
        run: echo "Slack validation was skipped. SLACK_SERVICE_TOKEN is not available to this run." >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: check
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
      )
    runs-on: ubuntu-latest
    outputs:
      failure_kind: ${{ steps.verify.outputs.failure_kind || steps.icon.outputs.failure_kind || steps.result.outputs.failure_kind || steps.exists.outputs.failure_kind || steps.prepare.outputs.failure_kind }}
      failure_help: ${{ steps.verify.outputs.failure_help || steps.icon.outputs.failure_help || steps.result.outputs.failure_help || steps.exists.outputs.failure_help || steps.prepare.outputs.failure_help }}

    steps:
      - name: Setup job workspace
        uses: ServerlessOpsIO/gha-setup-workspace@v2

      - name: Setup Python environment
        uses: ServerlessOpsIO/gha-setup-python@v1
        with:
          python_version: '3.14'

      # Contacts nothing. Fails here when no app is recorded.
      - name: Prepare the update
        id: prepare
        env:
          SLACK_SERVICE_TOKEN: ${{ secrets.SLACK_SERVICE_TOKEN }}
          SLACK_APP_ID: ${{ vars.SLACK_APP_ID }}
        run: pipenv run slack-app prepare --payload "$RUNNER_TEMP/slack-update.json"

      # Confirms the recorded app still exists before anything is sent, so a
      # deleted app is reported as that and never mistaken for an outage.
      - name: Ask Slack for the recorded app
        id: export
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: apps.manifest.export
          token: ${{ secrets.SLACK_SERVICE_TOKEN }}
          payload: |
            app_id: ${{ vars.SLACK_APP_ID }}

      # The manifest Slack returns holds no secrets, so it is passed on whole.
      - name: Confirm the app exists
        id: exists
        env:
          SLACK_ACTION_OK: ${{ steps.export.outputs.ok }}
          SLACK_ACTION_ERROR: ${{ fromJSON(steps.export.outputs.response || '{}').error }}
          SLACK_ACTION_ERRORS: ${{ toJSON(fromJSON(steps.export.outputs.response || '{}').errors) }}
          SLACK_ACTION_STATUS: ${{ fromJSON(steps.export.outputs.response || '{}').statusCode }}
          SLACK_ACTION_CODE: ${{ fromJSON(steps.export.outputs.response || '{}').code }}
          SLACK_ACTION_RETRY_AFTER: ${{ fromJSON(steps.export.outputs.response || '{}').retryAfter }}
          SLACK_ACTION_MANIFEST: ${{ toJSON(fromJSON(steps.export.outputs.response || '{}').manifest) }}
        run: pipenv run slack-app result --method apps.manifest.export

      - name: Update the Slack app
        id: slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: apps.manifest.update
          token: ${{ secrets.SLACK_SERVICE_TOKEN }}
          payload-file-path: ${{ runner.temp }}/slack-update.json

      - name: Read Slack's answer
        id: result
        env:
          SLACK_ACTION_OK: ${{ steps.slack.outputs.ok }}
          SLACK_ACTION_ERROR: ${{ fromJSON(steps.slack.outputs.response || '{}').error }}
          SLACK_ACTION_ERRORS: ${{ toJSON(fromJSON(steps.slack.outputs.response || '{}').errors) }}
          SLACK_ACTION_STATUS: ${{ fromJSON(steps.slack.outputs.response || '{}').statusCode }}
          SLACK_ACTION_CODE: ${{ fromJSON(steps.slack.outputs.response || '{}').code }}
          SLACK_ACTION_RETRY_AFTER: ${{ fromJSON(steps.slack.outputs.response || '{}').retryAfter }}
        run: pipenv run slack-app result --method apps.manifest.update

      # Uploads slack/icon.jpg or slack/icon.png. The program does this itself:
      # Slack's action cannot upload a file.
      - name: Set the app's icon
        id: icon
        env:
          SLACK_SERVICE_TOKEN: ${{ secrets.SLACK_SERVICE_TOKEN }}
          SLACK_APP_ID: ${{ vars.SLACK_APP_ID }}
        run: pipenv run slack-app icon

      # Fails when the installed app lacks a permission the definition has.
      - name: Check the installed app's permissions
        id: verify
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: pipenv run slack-app verify

  create:
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.action == 'create'
    runs-on: ubuntu-latest
    outputs:
      failure_kind: ${{ steps.create.outputs.failure_kind }}
      failure_help: ${{ steps.create.outputs.failure_help }}

    steps:
      - name: Setup job workspace
        uses: ServerlessOpsIO/gha-setup-workspace@v2

      - name: Setup Python environment
        uses: ServerlessOpsIO/gha-setup-python@v1
        with:
          python_version: '3.14'

      # Only when an app is already recorded: is it still there? The next step
      # refuses to create while it is, and replaces it only when Slack says it
      # does not exist.
      - name: Ask Slack for the recorded app
        id: export
        if: vars.SLACK_APP_ID != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: apps.manifest.export
          token: ${{ secrets.SLACK_SERVICE_TOKEN }}
          payload: |
            app_id: ${{ vars.SLACK_APP_ID }}

      # The program makes the creating call itself. Slack's answer to it holds
      # the app's secrets, and Slack's action would expose the whole answer as
      # a step output before anything could hide them.
      - name: Create the Slack app
        id: create
        env:
          SLACK_SERVICE_TOKEN: ${{ secrets.SLACK_SERVICE_TOKEN }}
          # Only this job writes to GitHub: the new app's ID and secrets.
          SLACK_GHA_STORE_TOKEN: ${{ secrets.SLACK_GHA_STORE_TOKEN }}
          SLACK_APP_ID: ${{ vars.SLACK_APP_ID }}
          SLACK_ACTION_OK: ${{ steps.export.outputs.ok }}
          SLACK_ACTION_ERROR: ${{ fromJSON(steps.export.outputs.response || '{}').error }}
          SLACK_ACTION_STATUS: ${{ fromJSON(steps.export.outputs.response || '{}').statusCode }}
          SLACK_ACTION_CODE: ${{ fromJSON(steps.export.outputs.response || '{}').code }}
          SLACK_ACTION_RETRY_AFTER: ${{ fromJSON(steps.export.outputs.response || '{}').retryAfter }}
        run: pipenv run slack-app create --existence-from-action

  # A job of its own so that it runs when an earlier job failed or was skipped.
  # A step inside apply would not run when check fails first.
  report:
    needs: [check, apply, create]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open or close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: slack-app-failure
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          CHANGED: ${{ needs.apply.result == 'success' || needs.create.result == 'success' }}
          # The text below comes only from the program's fixed list of failure
          # kinds, never from a response, because issues here are public.
          KIND: ${{ needs.create.outputs.failure_kind || needs.apply.outputs.failure_kind || needs.check.outputs.failure_kind || 'unexpected' }}
          HELP: ${{ needs.create.outputs.failure_help || needs.apply.outputs.failure_help || needs.check.outputs.failure_help || 'Read the log of the run.' }}
        run: |
          open_issue=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')

          if [ "$FAILED" = "true" ] && [ "$EVENT" = "schedule" ]; then
            body=$(printf 'The scheduled run of the Slack app workflow failed.\n\n**Failure:** `%s`\n\n**What to do:** %s\n\n**Run:** %s\n' "$KIND" "$HELP" "$RUN_URL")
            if [ -n "$open_issue" ]; then
              gh issue comment "$open_issue" --body "$body"
            else
              gh label create "$LABEL" --color B60205 \
                --description "A scheduled run of the Slack app workflow failed" --force
              gh issue create --title "Slack app: the scheduled run is failing" \
                --label "$LABEL" --body "$body"
            fi
          elif [ "$CHANGED" = "true" ] && [ -n "$open_issue" ]; then
            gh issue close "$open_issue" --comment "A later run passed: $RUN_URL"
          fi
