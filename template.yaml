AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  engineering-agents

  AWS AgentCore agents for engineering tasks


Parameters:
  Domain:
    Type: String
    Description: 'Name of Domain'

  System:
    Type: String
    Description: "Name of System"

  Component:
    Type: String
    Description: "Name of Component"

  CodeBranch:
    Type: String
    Description: "Name of GitHub Branch"

  ContainerRepo:
    Type: String
    Description: "ECR registry host that holds the agent image; ex. 123456789012.dkr.ecr.us-east-1.amazonaws.com"

  ContainerOrg:
    Type: String
    Description: "First part of the ECR repository name (the GitHub owner slug)"

  ContainerImage:
    Type: String
    Description: "Second part of the ECR repository name (the GitHub repository slug)"

  ContainerTag:
    Type: String
    Description: "Agent image tag. The workflows pass the commit SHA."

  ModelId:
    Type: String
    Description: >-
      Amazon Bedrock inference profile ID the agent uses. It must be a United
      States profile, which starts with "us."; ex. us.openai.gpt-6-luna
    AllowedPattern: '^us\.[a-zA-Z0-9.:_-]+$'
    ConstraintDescription: >-
      must be a United States inference profile ID starting with "us.". Global
      profiles are refused because the organization restricts regions.

  ReasoningEffort:
    Type: String
    Description: >-
      How much the model reasons before answering. "default" leaves the choice
      to the model.
    AllowedValues:
      - default
      - none
      - low
      - medium
      - high
      - xhigh
      - max
    Default: default

  MaxPromptChars:
    Type: Number
    Description: "Longest prompt the agent accepts, in characters"
    Default: 4000

  LogLevel:
    Type: String
    Description: "Agent log level"
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
    Default: INFO

  MemoryEventExpiryDays:
    Type: Number
    Description: "Days a conversation's events are kept in AgentCore Memory"
    MinValue: 3
    MaxValue: 365
    Default: 7

  Hostname:
    Type: String
    Description: "Hostname Slack sends events to"

  DnsZoneId:
    Type: AWS::SSM::Parameter::Value<String>
    Description: "Route 53 hosted zone ID for the hostname"

  SlackSigningSecretParameter:
    Type: String
    Description: "Name of the Parameter Store SecureString that holds the Slack signing secret. A name, not the secret."
    Default: /engineering-agents/slack/signing-secret

  SlackBotTokenParameter:
    Type: String
    Description: "Name of the Parameter Store SecureString that holds the Slack bot token. A name, not the token."
    Default: /engineering-agents/slack/bot-token


Conditions:
  # Only the stack deployed from main receives Slack's events. A branch stack
  # has the agent and none of the Slack receiving service.
  ConnectSlack: !Equals [!Ref CodeBranch, main]


Globals:
  Function:
    Runtime: python3.14
    Architectures:
      - arm64
    # Slack waits three seconds for an answer, so the front door gives up then
    # too. The worker and the cleanup function set their own timeouts.
    Timeout: 3
    MemorySize: 512
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: !Ref AWS::StackName


Resources:
  # Role the runtime assumes to run the agent. It follows the AWS-documented
  # AgentCore Runtime execution role, narrowed to this agent's log groups,
  # model and image repository.
  AgentExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*'
      Policies:
        - PolicyName: AgentRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DescribeLogStreams
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*'
              - Sid: LogGroupDiscovery
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
              - Sid: LogEvents
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*'
              # Wildcard resources: the X-Ray actions, cloudwatch:PutMetricData
              # and ecr:GetAuthorizationToken do not support resource-level
              # permissions. PutMetricData is limited to the AgentCore namespace.
              - Sid: Tracing
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore
              - Sid: EcrToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              # The image repository is in the CI/CD account. Its account ID
              # and region are taken from the registry host in ContainerRepo.
              - Sid: EcrImage
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub
                  - 'arn:${AWS::Partition}:ecr:${RepoRegion}:${RepoAccountId}:repository/${ContainerOrg}/${ContainerImage}'
                  - RepoAccountId: !Select [0, !Split ['.', !Ref ContainerRepo]]
                    RepoRegion: !Select [3, !Split ['.', !Ref ContainerRepo]]
              # The agent may call its configured inference profile. OpenAI
              # models on the bedrock-runtime endpoint also need the account's
              # default Bedrock project, which is not a model.
              - Sid: Model
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}'
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:project/default'
              # The profile routes each request to the model in one of several
              # regions, so the foundation model is allowed in any region, but
              # only when the request comes through the configured profile.
              # The condition is used instead of naming the model because the
              # model's name cannot be derived reliably from the profile ID.
              - Sid: ModelThroughProfile
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock:::foundation-model/*'
                Condition:
                  StringEquals:
                    bedrock:InferenceProfileArn: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}'
              - Sid: Memory
                Effect: Allow
                Action:
                  - bedrock-agentcore:CreateEvent
                  - bedrock-agentcore:GetEvent
                  - bedrock-agentcore:ListEvents
                  - bedrock-agentcore:DeleteEvent
                  - bedrock-agentcore:ListSessions
                Resource: !GetAtt AgentMemory.MemoryArn

  # Runtime and memory names allow only letters, digits and underscores, with a
  # 48 character limit, so hyphens in the component and branch slugs become
  # underscores. A name change replaces the resource.
  AgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: !Join ['_', !Split ['-', !Sub '${Component}_${CodeBranch}']]
      RoleArn: !GetAtt AgentExecutionRole.Arn
      ProtocolConfiguration: HTTP
      NetworkConfiguration:
        NetworkMode: PUBLIC
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Sub '${ContainerRepo}/${ContainerOrg}/${ContainerImage}:${ContainerTag}'
      # Sessions end after 5 idle minutes and live for at most 30, which keeps
      # idle compute low. Raise both for agents that run long tasks.
      LifecycleConfiguration:
        IdleRuntimeSessionTimeout: 300
        MaxLifetime: 1800
      EnvironmentVariables:
        MODEL_ID: !Ref ModelId
        REASONING_EFFORT: !Ref ReasoningEffort
        MAX_PROMPT_CHARS: !Ref MaxPromptChars
        LOG_LEVEL: !Ref LogLevel
        MEMORY_ID: !GetAtt AgentMemory.MemoryId

  # Short-term conversation memory: the events of each session are kept for
  # MemoryEventExpiryDays. No long-term strategies are configured.
  AgentMemory:
    Type: AWS::BedrockAgentCore::Memory
    Properties:
      Name: !Join ['_', !Split ['-', !Sub '${Component}_${CodeBranch}']]
      Description: 'Conversation memory for engineering-agents'
      EventExpiryDuration: !Ref MemoryEventExpiryDays


  # --- The Slack receiving service -------------------------------------------
  # See docs/handbook/09-slack-messaging.md. Message text waits in these queues,
  # so both are encrypted and neither keeps a message for more than an hour.

  # Messages the worker did not finish. The cleanup function is triggered by it.
  SlackHeldBackQueue:
    Type: AWS::SQS::Queue
    Condition: ConnectSlack
    Properties:
      FifoQueue: true
      MessageRetentionPeriod: 3600
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true

  # Messages waiting to be answered. One group per Slack thread keeps a thread
  # in order. The worker is given a message once: with nowhere to record that a
  # message was answered, running twice could post twice, so an unfinished
  # message goes to the held-back queue instead.
  SlackMessageQueue:
    Type: AWS::SQS::Queue
    Condition: ConnectSlack
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: false
      MessageRetentionPeriod: 3600
      VisibilityTimeout: 300
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SlackHeldBackQueue.Arn
        maxReceiveCount: 1


  # The front door. It checks Slack's signature, answers Slack, and queues the
  # message. It can read the signing secret and send to the work queue, and
  # nothing else.
  ReceiveSlackEventFunction:
    Type: AWS::Serverless::Function
    Condition: ConnectSlack
    Properties:
      CodeUri: ./src/handlers/ReceiveSlackEvent
      Handler: function.handler
      LoggingConfig:
        LogGroup: !Ref ReceiveSlackEventFunctionLogGroup
      Environment:
        Variables:
          SLACK_SIGNING_SECRET_PARAMETER: !Ref SlackSigningSecretParameter
          SLACK_MESSAGE_QUEUE_URL: !Ref SlackMessageQueue
          MEMORY_EXPIRY_DAYS: !Ref MemoryEventExpiryDays
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: SigningSecret
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SlackSigningSecretParameter}'
            # Wildcard resource: the parameter is encrypted with the account's
            # key for Parameter Store, whose ID is not known to the template.
            # The condition limits the key's use to Parameter Store.
            - Sid: DecryptThroughParameterStore
              Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
              Condition:
                StringEquals:
                  kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
            - Sid: QueueMessages
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt SlackMessageQueue.Arn

  ReceiveSlackEventFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ConnectSlack
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ReceiveSlackEvent'
      RetentionInDays: 30

  ReceiveSlackEventFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: ConnectSlack
    Properties:
      FunctionName: !GetAtt ReceiveSlackEventFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/slack/events'

  # The worker. It asks the agent and posts the reply. It can read the bot
  # token, take messages from the work queue and call this stack's agent, and
  # nothing else. It cannot read the signing secret or send to either queue.
  AnswerSlackMessageFunction:
    Type: AWS::Serverless::Function
    Condition: ConnectSlack
    Properties:
      CodeUri: ./src/handlers/AnswerSlackMessage
      Handler: function.handler
      # Two tries at the agent of up to 100 seconds each, and the calls to
      # Slack. It must stay under the work queue's visibility timeout.
      Timeout: 240
      LoggingConfig:
        LogGroup: !Ref AnswerSlackMessageFunctionLogGroup
      Environment:
        Variables:
          SLACK_BOT_TOKEN_PARAMETER: !Ref SlackBotTokenParameter
          AGENT_RUNTIME_ARN: !GetAtt AgentRuntime.AgentRuntimeArn
          MAX_PROMPT_CHARS: !Ref MaxPromptChars
          MEMORY_EXPIRY_DAYS: !Ref MemoryEventExpiryDays
      Events:
        SlackMessageQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt SlackMessageQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 5
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: BotToken
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SlackBotTokenParameter}'
            # Wildcard resource, for the same reason as the front door's.
            - Sid: DecryptThroughParameterStore
              Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
              Condition:
                StringEquals:
                  kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
            # The runtime and its endpoints: InvokeAgentRuntime is checked
            # against both.
            - Sid: AskTheAgent
              Effect: Allow
              Action: bedrock-agentcore:InvokeAgentRuntime
              Resource:
                - !GetAtt AgentRuntime.AgentRuntimeArn
                - !Sub '${AgentRuntime.AgentRuntimeArn}/runtime-endpoint/*'

  AnswerSlackMessageFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ConnectSlack
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-AnswerSlackMessage'
      RetentionInDays: 30

  # The cleanup function. It deals with a message the worker did not finish:
  # it posts the apology if one is owed and removes the eyes. It can read the
  # bot token and take messages from the held-back queue. It cannot call the
  # agent.
  CleanUpSlackMessageFunction:
    Type: AWS::Serverless::Function
    Condition: ConnectSlack
    Properties:
      CodeUri: ./src/handlers/CleanUpSlackMessage
      Handler: function.handler
      # It must stay under the held-back queue's visibility timeout.
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref CleanUpSlackMessageFunctionLogGroup
      Environment:
        Variables:
          SLACK_BOT_TOKEN_PARAMETER: !Ref SlackBotTokenParameter
      Events:
        SlackHeldBackQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt SlackHeldBackQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: BotToken
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SlackBotTokenParameter}'
            # Wildcard resource, for the same reason as the front door's.
            - Sid: DecryptThroughParameterStore
              Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
              Condition:
                StringEquals:
                  kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  CleanUpSlackMessageFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ConnectSlack
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-CleanUpSlackMessage'
      RetentionInDays: 30

  # The public address.
  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: ConnectSlack
    Properties:
      DomainName: !Ref Hostname
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref Hostname
          HostedZoneId: !Ref DnsZoneId

  RestApiLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ConnectSlack
    Properties:
      LogGroupName: !Sub "/aws/api-gateway/${AWS::StackName}"
      RetentionInDays: 7

  RestApi:
    Type: AWS::Serverless::Api
    Condition: ConnectSlack
    Properties:
      StageName: !Ref CodeBranch
      Domain:
        DomainName: !Ref Hostname
        CertificateArn: !Ref SiteCertificate
        Route53:
          HostedZoneId: !Ref DnsZoneId
        EndpointConfiguration: REGIONAL
      # The access log has no request or response content in it.
      AccessLogSetting:
        DestinationArn: !GetAtt RestApiLogGroup.Arn
        Format: '$context.extendedRequestId $context.identity.sourceIp $context.identity.caller $context.identity.user [$context.requestTime] "$context.httpMethod $context.resourcePath $context.protocol" $context.status $context.responseLength $context.requestId'
      # Execution logging is off. It is not established that it keeps request
      # bodies out of the log, and they hold what people wrote in Slack. The
      # throttle caps what a flood of requests to this public address can cost.
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: "OFF"
          MetricsEnabled: true
          DataTraceEnabled: false
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
      DefinitionBody:
        Fn::Transform:
          Name: "AWS::Include"
          Parameters:
            Location: "openapi.yaml"


Outputs:
  AgentRuntimeArn:
    Description: "ARN of the agent runtime. Callers need bedrock-agentcore:InvokeAgentRuntime on it."
    Value: !GetAtt AgentRuntime.AgentRuntimeArn

  AgentRuntimeId:
    Description: "ID of the agent runtime. Logs are in /aws/bedrock-agentcore/runtimes/<id>-DEFAULT."
    Value: !GetAtt AgentRuntime.AgentRuntimeId

  AgentMemoryId:
    Description: "ID of the agent's AgentCore Memory"
    Value: !GetAtt AgentMemory.MemoryId

  SlackMessageQueueUrl:
    Condition: ConnectSlack
    Description: "URL of the queue of Slack messages waiting to be answered"
    Value: !Ref SlackMessageQueue

  SlackHeldBackQueueUrl:
    Condition: ConnectSlack
    Description: "URL of the queue of Slack messages the worker did not finish"
    Value: !Ref SlackHeldBackQueue

  SlackEventsUrl:
    Condition: ConnectSlack
    Description: "Address Slack sends events to. It is event_request_url in slack/settings.json."
    Value: !Sub 'https://${Hostname}/slack/events'
